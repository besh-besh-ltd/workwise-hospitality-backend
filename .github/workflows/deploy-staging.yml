name: Deploy Backend (staging)

on:
  push:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-qa
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build Docker image & push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to staging EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: IMAGE_URI
          script: |
            set -euo pipefail

            ENV_FILE="$HOME/.env.backend-staging"
            printf '%s\n' '${{ secrets.ENV_STAGING }}' > "$ENV_FILE"

            # ECR login
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # Pull and deploy
            docker pull "${IMAGE_URI}"
            bash "$HOME/deploy.sh" backend "${IMAGE_URI}"
