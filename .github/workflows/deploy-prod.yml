name: Deploy Backend (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to deploy (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-backend-prod
  # Never cancel a run that may be mid-migration. Queue instead.
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  build-and-push:
    name: Build Docker image & push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan database migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    outputs:
      has_pending: ${{ steps.decide.outputs.has_pending }}
    steps:
      - name: Write env file
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_CONTENT: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: printf '%s\n' "$ENV_CONTENT" > "$HOME/.env"

      # Read-only. Runs before the approval so the reviewer can see exactly what
      # they are approving, rather than approving a job and finding out after.
      - name: Compute the migration plan
        id: status
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          # No script_stop: it is not an input at appleboy/ssh-action@v1.2.5 and
          # only produces an "Unexpected input(s)" warning. Every script below
          # begins with `set -euo pipefail`, which is what v1.2.5's README
          # recommends in its place. Do not re-add it.
          command_timeout: 10m
          capture_stdout: true
          envs: IMAGE_URI
          script: |
            set -euo pipefail
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            docker pull "${IMAGE_URI}" >/dev/null
            docker run --rm --env-file "$HOME/.env" "${IMAGE_URI}" npm run migrate:status --silent

      - name: Publish the plan and decide whether approval is needed
        id: decide
        env:
          PLAN: ${{ steps.status.outputs.stdout }}
        run: |
          set -euo pipefail
          echo "$PLAN"

          COUNT=$(printf '%s\n' "$PLAN" | grep -oE '^PENDING_COUNT=[0-9]+$' | tail -1 | cut -d= -f2 || true)
          if [ -z "${COUNT:-}" ]; then
            echo "::error::Could not read PENDING_COUNT from migrate:status output. Refusing to guess."
            exit 1
          fi

          {
            echo "## Database migration plan"
            echo ""
            if [ "$COUNT" -eq 0 ]; then
              echo "**No pending migrations.** Deploying without an approval gate."
            else
              echo "**$COUNT migration(s) will be applied to production before the deploy.**"
              echo ""
              echo '```'
              printf '%s\n' "$PLAN"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Apply database migrations (production)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.has_pending == 'true'
    # Required reviewers on this environment are what pause the run. The job sits
    # in "Waiting" having changed nothing, and GitHub fails it after 30 days.
    environment: production
    timeout-minutes: 20
    steps:
      - name: Apply migrations
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          # No script_stop: it is not an input at appleboy/ssh-action@v1.2.5 and
          # only produces an "Unexpected input(s)" warning. Every script below
          # begins with `set -euo pipefail`, which is what v1.2.5's README
          # recommends in its place. Do not re-add it.
          command_timeout: 15m
          envs: IMAGE_URI
          script: |
            set -euo pipefail
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            docker pull "${IMAGE_URI}" >/dev/null

            # --yes: up/down refuse a non-local target without it. This job runs only
            # after a human approved the plan, so the explicit flag records that the
            # remote write was intended rather than inherited from an ambient .env.
            docker run --rm --env-file "$HOME/.env" "${IMAGE_URI}" npm run migrate:up --silent -- --yes
            docker run --rm --env-file "$HOME/.env" "${IMAGE_URI}" npm run migrate:verify --silent

  deploy:
    name: Deploy to production EC2
    runs-on: ubuntu-latest
    needs: [build-and-push, plan, migrate]
    # `migrate` is skipped when nothing is pending, and a skipped need would
    # otherwise skip this job too. Deploy unless something actually failed or the
    # run was cancelled — a failed migration must never be followed by a deploy:
    # the old code keeps serving, which is safe precisely because migrations are
    # backward-compatible with it.
    if: always() && !failure() && !cancelled()
    timeout-minutes: 15
    steps:
      - name: Write env file
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_CONTENT: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: printf '%s\n' "$ENV_CONTENT" > "$HOME/.env"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          # No script_stop: it is not an input at appleboy/ssh-action@v1.2.5 and
          # only produces an "Unexpected input(s)" warning. Every script below
          # begins with `set -euo pipefail`, which is what v1.2.5's README
          # recommends in its place. Do not re-add it.
          command_timeout: 10m
          envs: IMAGE_URI
          script: |
            set -euo pipefail

            # ECR login
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # Pull and deploy
            docker pull "${IMAGE_URI}"
            bash "$HOME/deploy-prod.sh" "${IMAGE_URI}"
