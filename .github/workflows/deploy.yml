name: Deploy Backend (production)

on:
  push:
    branches:
      - main_
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 35m
          script: |
            set -euo pipefail

            APP_DIR="/var/www/hospitality/backend"
            DEPLOY_BRANCH="main"

            cd "$APP_DIR"                       # go to /var/www/hospitality/backend
            git fetch --prune origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            npm i                               # run npm i
            cat > .env <<'EOF'      # replace .env.production from GitHub secret
            ${{ secrets.ENV_PRODUCTION }}
            EOF
            pm2 restart backend --update-env   # restart pm2 with updated env
