name: Deploy Backend (staging)

on:
  push:
    branches:
      - qa
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to deploy (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-backend-qa
  # Never cancel a run that may be mid-migration: a cancelled deploy can leave
  # migrations half-applied, or the container half-swapped. Queue instead.
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPOSITORY }}
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  build-and-push:
    name: Build Docker image & push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  migrate:
    name: Apply database migrations (staging)
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    steps:
      # The deploy job writes this too, but migrate now runs first and needs the
      # database credentials. Writing it twice is idempotent and keeps the two
      # jobs independently re-runnable.
      - name: Write env file
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_CONTENT: ${{ secrets.ENV_STAGING }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: printf '%s\n' "$ENV_CONTENT" > "$HOME/.env.backend-staging"

      # Runs inside the image that is about to be deployed. migrations/ is in the
      # image (Dockerfile's COPY . ., not excluded by .dockerignore), so the
      # migration files are byte-identical to the code they accompany — no
      # version skew, no new secret, no new route to the database.
      - name: Apply migrations
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: IMAGE_URI
          script: |
            set -euo pipefail

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            docker pull "${IMAGE_URI}"

            docker run --rm --env-file "$HOME/.env.backend-staging" "${IMAGE_URI}" \
              npm run migrate:status --silent

            # --yes is required because the target is a remote database. up/down
            # refuse a non-local target without it, so a developer running
            # `npm run migrate:up` from a terminal cannot silently write to a shared
            # environment — backend/.env resolves to hospitality_stage on RDS.
            # Here the intent IS to migrate the remote database, stated explicitly.
            docker run --rm --env-file "$HOME/.env.backend-staging" "${IMAGE_URI}" \
              npm run migrate:up --silent -- --yes

            docker run --rm --env-file "$HOME/.env.backend-staging" "${IMAGE_URI}" \
              npm run migrate:verify --silent

  deploy:
    name: Deploy to staging EC2
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    timeout-minutes: 15
    steps:
      - name: Write env file
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_CONTENT: ${{ secrets.ENV_STAGING }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: printf '%s\n' "$ENV_CONTENT" > "$HOME/.env.backend-staging"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.BACKEND_ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: IMAGE_URI
          script: |
            set -euo pipefail

            # ECR login
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # Pull and deploy
            docker pull "${IMAGE_URI}"
            bash "$HOME/deploy.sh" backend "${IMAGE_URI}"
