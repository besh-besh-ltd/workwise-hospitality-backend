name: Backend CI - Integration Tests

# Runs the Jest integration suite on every PR targeting main / qa, split across
# parallel per-domain shards. A green `CI gate` check is the merge gate — no
# need to run tests locally before review.
#
# ---------------------------------------------------------------------------
# WHY THIS IS SHARDED (do not collapse it back into one job)
#
# Each suite retains ~29 MB that is never released — every one of them imports
# the whole app (express + pg-promise + aws-sdk + handlebars) and the module
# registry is held for the life of the process. Measured locally:
#     suite   1 ->   218 MB
#     suite  90 -> 2,814 MB   (peak 2,946 MB)
# All 167 suites in a single process projects to ~5,060 MB against Node 20's
# ~4,096 MB default heap, so the old single-job CI died with
# "Ineffective mark-compacts near heap limit" and ZERO `FAIL` lines — a
# deterministic arithmetic failure that looked like a flake. Every shard below
# peaks 3-5x under that ceiling.
#
# WHY ONE JOB PER SHARD, RATHER THAN RAISING jest --maxWorkers
#
# All suites in a Jest process share ONE database and isolate from each other
# via per-test transactional rollback. Concurrent workers would interleave
# transactions on the same rows. The unit of parallelism therefore has to be
# one database per Jest process, which means one per job. `maxWorkers: 1` in
# jest.config.js is load-bearing — leave it alone.
#
# HOW EACH SHARD GETS ITS OWN DATABASE (no harness changes)
#
# tests/setup/envguard.js:52 reads TEST_RUN_ID before falling back to
# GITHUB_RUN_ID, so setting TEST_RUN_ID=ci_<run_id>_<shard> below yields
# hospitality_test_ci_<run_id>_<shard>, which still satisfies the prefix guard
# and the safe-name regex. Each matrix job also gets its own runner and its own
# Postgres service container, so the shards cannot see each other's databases
# even in principle.
#
# ADDING A TEST FILE
#
# Shard patterns live in tests/shards.json. The `shards` job below fails the
# whole build if any suite matches zero shards (it would silently never run) or
# more than one. Fix the pattern there — the guard is the only thing keeping
# domain sharding honest.
#
# ---------------------------------------------------------------------------
# Required repo secret:
#   ENV_TEST  - full contents of .env.test, with CI-appropriate Postgres creds.
#               Example minimum (matches the service container below):
#                   NODE_ENV=test
#                   PORT=8002
#                   HOST=localhost
#                   DATABASE_USERNAME=postgres
#                   DATABASE_PASSWORD=postgres
#                   DATABASE_PORT=5432
#                   DATABASE_DIALECT=postgres
#                   TEST_DB_NO_SSL=1
#                   TEST_MAINTENANCE_DB=postgres
#                   TEST_DB_PREFIX=hospitality_test
#                   ... (plus the JWT / SMTP / AWS / Razorpay placeholders
#                        from the committed .env.test — required to boot
#                        the app under test)

on:
  pull_request:
    branches: [main, qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR/branch. New pushes cancel in-flight runs to save minutes.
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate + fan-out. Proves the shard patterns are an exact partition of the
  # suite, then emits the job matrix from the same file. The shard-coverage and
  # response-in-tx checks below need no dependencies and no database, so they
  # run first and fail fast: a broken partition means no shard runs at all,
  # rather than a green build with untested code.
  #
  # This job also gates on the migration tooling suite and the migration
  # naming/ordering/reversibility/immutability checks (test:tooling,
  # check:migrations) — see those steps below for why they live here rather
  # than in `test`. Neither imports an npm package as of this writing
  # (verified: both still exit 0 with node_modules removed entirely), but
  # `npm ci` runs before them anyway as a hedge against that becoming false
  # later and failing in a confusing way instead of a loud one. That means
  # this job is no longer dependency-free end to end — only its first two
  # steps still are; budget for an `npm ci` (cached, typically well under a
  # minute) before the migration steps run.
  # ---------------------------------------------------------------------------
  shards:
    name: Static gates + shard coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-migrations.mjs diffs the migrations directory against the base
          # branch; depth 1 has no base branch to diff against.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify every suite is covered exactly once
        run: node scripts/check-shard-coverage.mjs

      # Responding from inside a db.tx()/db.task() callback flushes the response
      # before pg-promise issues COMMIT: the client can 404 on a record it just
      # created (its re-read lands on another pooled connection and sees the
      # pre-commit snapshot), and a failing COMMIT can no longer be reported
      # because the headers are already sent. It is also what made arc-core-2
      # fail intermittently with a rotating victim suite.
      #
      # Like the shard-coverage gate above this needs no dependencies and no
      # database, so it stays in this ~10s fail-fast job rather than costing an
      # npm ci. See scripts/check-response-in-tx.mjs for the scoping rules.
      - name: Verify no HTTP response is emitted inside a transaction
        run: node scripts/check-response-in-tx.mjs

      # Only the two static checks above run before this. See the job comment
      # at the top: test:tooling and check:migrations don't import npm
      # packages today, but this install is the hedge for when they do.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Migration tooling is plain node:test — no app boot, no database, ~1s. It
      # deliberately lives outside tests/ so that check-shard-coverage.mjs, which
      # requires every tests/**/*.test.js to match exactly one shard, does not
      # have to carry a suite that needs neither a shard nor a database.
      - name: Verify migration tooling
        run: npm run test:tooling

      # Naming, ordering, reversibility, immutability, transaction control.
      # The immutability gate is the checksum node-pg-migrate's ledger lacks:
      # editing an already-merged migration makes the file disagree with what
      # staging and production actually ran, forever and silently.
      - name: Verify migration gates
        run: npm run check:migrations

      - name: Build job matrix
        id: plan
        run: echo "matrix=$(node scripts/check-shard-coverage.mjs --matrix)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # One job per shard. Each is a fully independent runner + Postgres + database.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.name }} (${{ matrix.suites }} suites)
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # A red domain must not cancel the other shards — losing the other results
      # would forfeit exactly the failure attribution this split exists to give.
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}

    services:
      postgres:
        # Schema dump in tests/setup/schema.sql was produced by pg_dump 17.x;
        # the server must be >= 17 to apply it cleanly.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Skip Chromium download — no test exercises the puppeteer code paths
      # (ARC PDF generation, etc. are not covered by the integration suite).
      # Both var names set to cover puppeteer pre-22 / 22+.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      # Belt-and-suspenders. jestEnv.js / envguard.js also force this.
      NODE_ENV: test
      # Pin the POSTGRES SESSION timezone to UTC, matching production (verified:
      # prod's current_setting('TimeZone') is UTC, and the app never sets one).
      #
      # This is not cosmetic. `tbl_rfq.bid_end_date` is text holding a naive IST
      # wall-clock string, so every comparison against NOW()/CURRENT_DATE resolves
      # through the session timezone. A local Homebrew Postgres inherits the
      # developer's system zone — Asia/Kolkata — where those comparisons are
      # accidentally correct and the bug is INVISIBLE. Production is UTC, where it
      # is wrong by 5h30m (or a whole calendar day, 18:30-24:00 UTC).
      #
      # That divergence is precisely why this bug class kept reaching production.
      # postgres:17 already defaults to UTC, but relying on a container default
      # leaves it implicit and silently changeable; pinning it makes CI reproduce
      # production's frame on purpose.
      #
      # To reproduce an IST boundary bug locally, override it per-run:
      #   PGOPTIONS="-c timezone=UTC" npm test -- --testPathPatterns "..."
      # Note TZ= does NOT work: that is a Node setting and never reaches Postgres.
      # Note also the error is (5h30m - session_offset), so it CHANGES SIGN east
      # of IST — test both UTC and e.g. Asia/Singapore to catch both directions.
      PGOPTIONS: '-c timezone=UTC'
      # Gives this shard its own database — see the header. Non-alphanumerics
      # are collapsed to '_' by envguard's sanitize(), so 'po-pricing' becomes
      # hospitality_test_ci_<run_id>_po_pricing.
      TEST_RUN_ID: ci_${{ github.run_id }}_${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify ENV_TEST secret is present
        env:
          ENV_TEST: ${{ secrets.ENV_TEST }}
        run: |
          if [ -z "${ENV_TEST:-}" ]; then
            echo "::error::Repo secret ENV_TEST is not set. Add the full .env.test contents (with CI Postgres credentials) under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Write .env.test from secret
        env:
          ENV_TEST: ${{ secrets.ENV_TEST }}
        run: |
          # Overwrites the committed .env.test (which targets local brew Postgres)
          # so envguard.js / jestEnv.js pick up CI credentials.
          printf '%s\n' "$ENV_TEST" > .env.test
          # Sanity: required keys are present. Don't print the file (secrets).
          for key in NODE_ENV HOST DATABASE_USERNAME DATABASE_PORT TEST_DB_NO_SSL TEST_MAINTENANCE_DB TEST_DB_PREFIX JWT_SECRET CRYPT_SECRET; do
            if ! grep -q "^${key}=" .env.test; then
              echo "::error::ENV_TEST is missing required key: ${key}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Wait for Postgres
        # Actions already blocks the first step until the service container's
        # own --health-cmd passes, so this is belt-and-suspenders only. It uses
        # the `pg` package (already present via pg-promise) instead of
        # apt-get installing postgresql-client, which cost ~20s in every job.
        run: |
          node -e '
            const pg = require("pg");
            const deadline = Date.now() + 60000;
            (async () => {
              for (;;) {
                try {
                  const c = new pg.Client({ host: "localhost", port: 5432, user: "postgres", password: "postgres", database: "postgres" });
                  await c.connect();
                  console.log((await c.query("SELECT version()")).rows[0].version);
                  await c.end();
                  return;
                } catch (e) {
                  if (Date.now() > deadline) { console.error("::error::Postgres did not become ready in time"); process.exit(1); }
                  await new Promise((r) => setTimeout(r, 2000));
                }
              }
            })();
          '

      - name: Run integration tests
        env:
          SHARD_PATTERN: ${{ matrix.pattern }}
          JEST_SHARD: ${{ matrix.jestShard }}
        # `npm test` already exports NODE_OPTIONS=--experimental-vm-modules and
        # NODE_ENV=test. Jest config pins maxWorkers=1, so --runInBand is
        # redundant. Jest exits non-zero when a pattern matches no suites
        # (passWithNoTests defaults to false), so a typo'd pattern fails loudly
        # rather than passing vacuously.
        run: |
          if [ -n "$JEST_SHARD" ]; then
            npm test -- --ci --colors --testPathPatterns "$SHARD_PATTERN" --shard "$JEST_SHARD"
          else
            npm test -- --ci --colors --testPathPatterns "$SHARD_PATTERN"
          fi

      # No test-database cleanup step: the Postgres service container is
      # destroyed with the runner, so `npm run test:cleanup` was always a no-op
      # here. It remains the right command for local development.

  # ---------------------------------------------------------------------------
  # The dry run. Restores the production schema baseline into a throwaway
  # database, seeds the ledger from the manifest, and applies whatever this PR
  # adds — an actual apply against production's actual shape, which is the only
  # thing that finds "that column already exists" or "that backfill violates a
  # NOT NULL". Then reverts and re-applies the new migrations, because a down
  # migration that has never executed is decorative.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migration replay (production baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: migration_replay
      TEST_DB_NO_SSL: '1'
      REPLAY_MAINTENANCE_DB: postgres
      # Production's session timezone is UTC and bid_end_date comparisons resolve
      # through it. Same reasoning as the test shards — see their PGOPTIONS note.
      PGOPTIONS: '-c timezone=UTC'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to work out which migrations this PR adds, for the redo below.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Rebuild the replay database from the production baseline
        run: npm run migrate:replay

      - name: Show the migration plan
        run: npm run migrate:status

      - name: Apply pending migrations
        run: npm run migrate:up

      - name: Assert nothing is left pending
        run: npm run migrate:verify

      # Reverting only what this PR added: the baselined history has no down
      # migrations to run (it was never applied here), and reverting further
      # would test the baseline, not the change under review.
      - name: Revert and re-apply this PR's migrations
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          NEW_UP=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- 'migrations/*.up.sql' | wc -l | tr -d ' ')
          NEW_DOWN=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- 'migrations/*.down.sql' | wc -l | tr -d ' ')
          echo "This PR adds ${NEW_UP} up migration(s) and ${NEW_DOWN} down migration(s)."

          if [ "$NEW_UP" -eq 0 ]; then
            echo "No new migrations — nothing to redo."
            exit 0
          fi
          if [ "$NEW_UP" -ne "$NEW_DOWN" ]; then
            echo "::notice::${NEW_UP} up vs ${NEW_DOWN} down migration(s); at least one is declared irreversible, so the redo is skipped."
            exit 0
          fi

          npm run migrate:down -- --count "$NEW_UP"
          npm run migrate:up
          npm run migrate:verify

  # ---------------------------------------------------------------------------
  # The single required status check. Branch protection points at THIS job, so
  # adding, renaming or splitting a shard never means editing branch protection.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate
    if: always()
    needs: [shards, test, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every shard succeeded
        run: |
          echo "static gates:  ${{ needs.shards.result }}"
          echo "test shards:    ${{ needs.test.result }}"
          echo "migration replay: ${{ needs.migrations.result }}"
          if [ "${{ needs.shards.result }}" != "success" ]; then
            echo "::error::A static gate failed — either tests/shards.json no longer partitions the suite, or an HTTP response is emitted inside a db.tx()/db.task() callback. Open the 'Static gates + shard coverage' job for which."
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::At least one test shard failed. Open the matrix above; the failing job is named for its domain."
            exit 1
          fi
          if [ "${{ needs.migrations.result }}" != "success" ]; then
            echo "::error::The migration replay failed — this PR's migrations do not apply cleanly to a database shaped like production. Reproduce locally: npm run migrate:replay && npm run migrate:up"
            exit 1
          fi
          echo "All shards green."
